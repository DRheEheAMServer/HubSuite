# 提高 Gradle 可用内存
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# ---------------------------------------------------------------------------
# Fabric 属性（版本查询：https://fabricmc.net/develop）
# 注意：26.1 起 Minecraft 不再混淆，使用官方 Mojang 名称，
#       因此 build.gradle 中没有 mappings 行，也没有 remapJar。
# ---------------------------------------------------------------------------
minecraft_version=26.1.2
loader_version=0.19.5
loom_version=1.18-SNAPSHOT
fabric_api_version=0.155.3+26.1.2

# ---------------------------------------------------------------------------
# 软依赖版本（compileOnly）
# ---------------------------------------------------------------------------
huskhomes_version=4.11+26.1.2
placeholder_api_version=3.0.0+26.1
luckperms_api_version=5.5

# ---------------------------------------------------------------------------
# 模组属性
# ---------------------------------------------------------------------------
# 服务端版本：每个 release 递增（见 docs/分发与更新.md）
server_version=0.6.0-beta.1
# 客户端版本：只在客户端真的改了才递增，没改就保持不变
client_version=0.6.0-beta.1
maven_group=cn.dreamgary
archives_base_name=hubsuite
